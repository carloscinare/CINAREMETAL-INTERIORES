name: Converter galeria para JPG

on:
  push:
    paths:
      - '.github/workflows/converter-galeria-jpg.yml'

permissions:
  contents: write

jobs:
  converter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow
      - run: python convert_gallery_to_jpg.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobiliario-industrial.html galeria/*.jpg
          git commit -m "Converter imagens da galeria para JPG"
          git push

# trigger 2

name: Criar galeria mobiliario

on:
  push:
    paths:
      - '.github/workflows/criar-galeria-mobiliario.yml'

permissions:
  contents: write

jobs:
  build-gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Pillow
        run: python -m pip install pillow

      - name: Criar imagens e pagina
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Path('mobiliario-industrial.png')
          if not src.exists():
              raise SystemExit('mobiliario-industrial.png nao encontrado')

          img = Image.open(src).convert('RGB')
          W, H = img.size
          sx, sy = W / 1440, H / 1080
          crops = [
              ('mesa-apoio.jpg','Mesa de apoio','Aco + madeira','Estrutura metalica preta e madeira rustica',(40,35,370,420)),
              ('prateleira-parede.jpg','Prateleira de parede','Aco + madeira','Solucao minimalista para decoracao e arrumacao',(390,35,950,300)),
              ('garrafeira.jpg','Garrafeira','Bar / cozinha','Suporte para garrafas e copos',(930,30,1390,390)),
              ('sapateira-banco.jpg','Banco sapateira','Entrada / corredor','Banco com arrumacao inferior',(25,410,485,705)),
              ('banco-alto.jpg','Banco alto','Aco + madeira','Peca compacta para cozinha ou bancada',(405,690,670,1035)),
              ('consola-industrial.jpg','Consola industrial','Sala / entrada','Movel comprido com prateleira inferior',(810,410,1395,715)),
          ]
          out = Path('galeria')
          out.mkdir(exist_ok=True)
          data=[]
          for filename,title,small,sub,box in crops:
              b=tuple(round(v*(sx if i%2==0 else sy)) for i,v in enumerate(box))
              c=img.crop(b)
              c.thumbnail((1200,900), Image.Resampling.LANCZOS)
              bg=Image.new('RGB',(1200,900),(242,239,235))
              x=(1200-c.width)//2; y=(900-c.height)//2
              bg.paste(c,(x,y))
              bg.save(out/filename,'JPEG',quality=90,optimize=True)
              data.append((filename,title,small,sub))

          cards='\n'.join(
              f'''<button class="item" data-src="./galeria/{fn}" data-title="{title}" data-sub="{sub}"><img src="./galeria/{fn}" alt="{title}"><span class="caption"><b>{title}</b><small>{small}</small></span></button>'''
              for fn,title,small,sub in data
          )

          page=f'''<!doctype html>
          <html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mobiliario Industrial — CINARE</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
          :root{{--bg:#090c0f;--panel:#11161b;--line:#242c33;--text:#f3f5f7;--muted:#a9b3bb;--accent:#d5a246;--max:1180px}}*{{box-sizing:border-box}}html{{scroll-behavior:smooth}}body{{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.55}}a{{color:inherit;text-decoration:none}}.wrap{{width:min(var(--max),calc(100% - 36px));margin:auto}}header{{position:sticky;top:0;z-index:20;background:rgba(9,12,15,.88);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.06)}}nav{{height:74px;display:flex;align-items:center;justify-content:space-between;gap:20px}}.brand{{font-size:20px;font-weight:800;letter-spacing:.16em}}.brand span{{color:var(--accent)}}.back{{padding:10px 14px;border:1px solid #303841;border-radius:10px;background:#10151a;font-size:14px;font-weight:700}}.hero{{padding:86px 0 54px;border-bottom:1px solid var(--line);position:relative;overflow:hidden}}.hero:before{{content:"";position:absolute;right:-150px;top:-170px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(213,162,70,.13),transparent 72%)}}.eyebrow{{color:var(--accent);font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:12px}}h1{{font-size:clamp(42px,6vw,72px);line-height:1.02;letter-spacing:-.045em;margin:12px 0 18px}}.lead{{color:var(--muted);font-size:18px;max-width:720px;margin:0}}main{{padding:64px 0 90px}}.gallery{{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}}.item{{position:relative;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--panel);cursor:pointer;padding:0;text-align:left;color:inherit;font:inherit;transition:.2s}}.item:hover{{transform:translateY(-3px);border-color:#46515b}}.item img{{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#eee}}.caption{{display:block;padding:16px 18px 18px}}.caption b{{display:block;font-size:17px;margin-bottom:3px}}.caption small{{color:var(--muted)}}.lightbox{{position:fixed;inset:0;z-index:100;background:rgba(4,6,8,.94);display:none;align-items:center;justify-content:center;padding:30px}}.lightbox.open{{display:flex}}.lightbox-inner{{width:min(1100px,100%);display:grid;grid-template-columns:56px 1fr 56px;align-items:center;gap:14px}}.viewer{{text-align:center}}.viewer img{{max-width:100%;max-height:78vh;border-radius:16px;box-shadow:0 30px 90px rgba(0,0,0,.6);background:#eee}}.viewer h2{{margin:16px 0 2px;font-size:22px}}.viewer p{{margin:0;color:var(--muted)}}.navbtn,.close{{border:1px solid #34404a;background:#111820;color:#fff;border-radius:12px;font-size:28px;cursor:pointer;height:56px}}.close{{position:absolute;top:22px;right:22px;width:48px;height:48px;font-size:22px}}footer{{border-top:1px solid var(--line);padding:28px 0 44px;color:#8e989f;font-size:13px}}.foot{{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}}@media(max-width:900px){{.gallery{{grid-template-columns:repeat(2,1fr)}}}}@media(max-width:560px){{.gallery{{grid-template-columns:1fr}}.hero{{padding-top:60px}}.brand{{font-size:16px}}.lightbox{{padding:18px}}.lightbox-inner{{grid-template-columns:1fr}}.navbtn{{position:absolute;bottom:22px;width:52px}}.prev{{left:22px}}.next{{right:22px}}.viewer img{{max-height:68vh}}}}
          </style></head><body><header><div class="wrap"><nav><a class="brand" href="./index.html">CINARE <span>METAL</span></a><a class="back" href="./index.html#servicos">← Voltar ao site</a></nav></div></header><section class="hero"><div class="wrap"><div class="eyebrow">Mobiliario industrial</div><h1>Ideias em aco e madeira.</h1><p class="lead">Seleciona qualquer imagem para a abrir em grande e veres o render com mais detalhe. Usa as setas para navegar entre os projetos.</p></div></section><main><div class="wrap"><div class="gallery">{cards}</div></div></main><div class="lightbox" id="lightbox" aria-hidden="true"><button class="close" id="close">×</button><div class="lightbox-inner"><button class="navbtn prev" id="prev">‹</button><div class="viewer"><img id="largeImg"><h2 id="largeTitle"></h2><p id="largeSub"></p></div><button class="navbtn next" id="next">›</button></div></div><footer><div class="wrap foot"><div>© 2026 CINARE Metal & Interiores</div><div>Barcelos · Portugal</div></div></footer><script>const items=[...document.querySelectorAll('.item')],box=document.getElementById('lightbox'),img=document.getElementById('largeImg'),title=document.getElementById('largeTitle'),sub=document.getElementById('largeSub');let current=0;function show(i){{current=(i+items.length)%items.length;const e=items[current];img.src=e.dataset.src;title.textContent=e.dataset.title;sub.textContent=e.dataset.sub;box.classList.add('open');document.body.style.overflow='hidden'}}function closeBox(){{box.classList.remove('open');document.body.style.overflow=''}}items.forEach((e,i)=>e.onclick=()=>show(i));document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);document.getElementById('close').onclick=closeBox;box.onclick=e=>{{if(e.target===box)closeBox()}};document.onkeydown=e=>{{if(!box.classList.contains('open'))return;if(e.key==='Escape')closeBox();if(e.key==='ArrowLeft')show(current-1);if(e.key==='ArrowRight')show(current+1)}};</script></body></html>'''
          Path('mobiliario-industrial.html').write_text(page,encoding='utf-8')

          index=Path('index.html')
          text=index.read_text(encoding='utf-8')
          css='.service-link{color:inherit;text-decoration:none;cursor:pointer;transition:.2s}.service-link:hover{transform:translateY(-3px);border-color:#4b555e}'
          if '.service-link{' not in text:
              text=text.replace('.card.with-photo h3{font-size:22px;color:#fff;margin:0 0 8px}',css+'\n    .card.with-photo h3{font-size:22px;color:#fff;margin:0 0 8px}')
          old='''        <article class="card with-photo">\n          <img class="service-card-image" src="./mobiliario-industrial.png?v=2" alt="Mobiliário industrial em metal e madeira">\n          <div class="icon">01</div>\n          <div class="service-card-content">\n            <h3>Mobiliário industrial</h3>\n            <p>Mesas de centro, secretárias, estantes, consolas e peças em aço e madeira produzidas por medida.</p>\n          </div>\n        </article>'''
          new='''        <a class="card with-photo service-link" href="./mobiliario-industrial.html" aria-label="Ver galeria de mobiliário industrial">\n          <img class="service-card-image" src="./mobiliario-industrial.png?v=2" alt="Mobiliário industrial em metal e madeira">\n          <div class="icon">01</div>\n          <div class="service-card-content">\n            <h3>Mobiliário industrial</h3>\n            <p>Mesas de centro, secretárias, estantes, consolas e peças em aço e madeira produzidas por medida.</p>\n          </div>\n        </a>'''
          if old in text:
              text=text.replace(old,new)
          index.write_text(text,encoding='utf-8')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html mobiliario-industrial.html galeria/
          git commit -m "Criar galeria de mobiliario industrial"
          git push

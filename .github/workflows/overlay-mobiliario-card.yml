name: Sobrepor texto no cartão mobiliário

on:
  push:
    paths:
      - '.github/workflows/overlay-mobiliario-card.yml'

permissions:
  contents: write

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Atualizar cartão Mobiliário industrial
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_css = '''    .card.with-photo{padding:18px}\n    .service-card-image{width:100%;height:160px;object-fit:cover;border-radius:12px;margin:0 0 18px;display:block}'''
          new_css = '''    .card.with-photo{padding:0;position:relative;overflow:hidden;min-height:300px;display:flex;align-items:flex-end}\n    .card.with-photo:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,9,11,.04) 15%,rgba(6,9,11,.18) 48%,rgba(6,9,11,.94) 100%);z-index:1;pointer-events:none}\n    .service-card-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:0}\n    .service-card-content{position:relative;z-index:2;width:100%;padding:22px}\n    .card.with-photo .icon{position:absolute;z-index:3;top:18px;left:18px;margin:0;background:rgba(32,27,18,.82);backdrop-filter:blur(5px)}\n    .card.with-photo h3{font-size:22px;color:#fff;margin:0 0 8px}\n    .card.with-photo p{color:#d6dde2;margin:0;max-width:32ch}'''
          if old_css in text:
              text = text.replace(old_css, new_css)

          old_card = '''        <article class="card with-photo">\n          <img class="service-card-image" src="./mobiliario-industrial.png?v=1" alt="Mobiliário industrial em metal e madeira">\n          <div class="icon">01</div>\n          <h3>Mobiliário industrial</h3>\n          <p>Mesas de centro, secretárias, estantes, consolas e peças em aço e madeira produzidas por medida.</p>\n        </article>'''
          new_card = '''        <article class="card with-photo">\n          <img class="service-card-image" src="./mobiliario-industrial.png?v=2" alt="Mobiliário industrial em metal e madeira">\n          <div class="icon">01</div>\n          <div class="service-card-content">\n            <h3>Mobiliário industrial</h3>\n            <p>Mesas de centro, secretárias, estantes, consolas e peças em aço e madeira produzidas por medida.</p>\n          </div>\n        </article>'''
          if old_card in text:
              text = text.replace(old_card, new_card)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit da alteração
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária"
          else
            git commit -m "Sobrepor texto no cartão Mobiliário industrial"
            git push
          fi

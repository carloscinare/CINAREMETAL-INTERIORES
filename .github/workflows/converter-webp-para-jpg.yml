name: Converter WebP para JPG e limpar

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  converter:
    if: github.head_ref == 'jpg-conversion-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Obter main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Instalar Pillow
        run: python -m pip install pillow

      - name: Gerar JPG válidos
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          gallery = Path('galeria')
          collage_path = Path('mobiliario-industrial.png')
          collage = Image.open(collage_path).convert('RGB')
          cw, ch = collage.size

          # Coordenadas de recurso na imagem original de 1536x1152.
          # São usadas apenas se o WebP correspondente estiver corrompido.
          crops = {
              'consola-industrial-nova': (820, 420, 1380, 720),
              'estante-industrial': (930, 700, 1390, 1045),
              'mesa-apoio-nova': (55, 105, 385, 445),
              'suporte-planta': (690, 675, 905, 1035),
              'prateleira-parede-nova': (410, 65, 940, 315),
              'porta-revistas': (70, 690, 370, 1030),
              'banco-sapateira-novo': (35, 420, 500, 710),
              'banco-alto-novo': (400, 680, 665, 1035),
          }

          def scaled_crop(box):
              x1, y1, x2, y2 = box
              return (
                  round(x1 * cw / 1536), round(y1 * ch / 1152),
                  round(x2 * cw / 1536), round(y2 * ch / 1152)
              )

          for stem, box in crops.items():
              src = gallery / f'{stem}.webp'
              dst = gallery / f'{stem}.jpg'
              image = None

              if src.exists():
                  try:
                      with Image.open(src) as im:
                          im.load()
                          image = im.convert('RGB')
                      print(f'OK WebP: {src}')
                  except Exception as exc:
                      print(f'WebP corrompido: {src}: {exc}')

              if image is None:
                  image = collage.crop(scaled_crop(box))
                  # Tamanho confortável para a galeria/lightbox.
                  image = ImageOps.contain(image, (1200, 900), Image.Resampling.LANCZOS)
                  print(f'Fallback da imagem original: {stem}')

              image.save(dst, 'JPEG', quality=92, optimize=True, progressive=True)
              print(f'Criado: {dst}')

          page = Path('mobiliario-industrial.html')
          html = page.read_text(encoding='utf-8')
          html = html.replace('.webp?v=1', '.jpg?v=3')
          html = html.replace('.webp', '.jpg')
          page.write_text(html, encoding='utf-8')

          for src in gallery.glob('*.webp'):
              src.unlink()
          PY

      - name: Remover automação temporária
        run: rm -f .github/workflows/converter-webp-para-jpg.yml

      - name: Guardar alterações no main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Converter galeria para JPG e remover WebP"
          git push origin main

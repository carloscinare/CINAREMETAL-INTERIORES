name: Converter WebP para JPG e limpar

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  converter:
    if: github.event.issue.title == 'RUN JPG CONVERSION'
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Instalar Pillow
        run: python -m pip install pillow

      - name: Converter galeria para JPG
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          gallery = Path('galeria')
          for src in sorted(gallery.glob('*.webp')):
              dst = src.with_suffix('.jpg')
              with Image.open(src) as im:
                  im.convert('RGB').save(dst, 'JPEG', quality=92, optimize=True, progressive=True)
              print(f'{src} -> {dst}')

          page = Path('mobiliario-industrial.html')
          html = page.read_text(encoding='utf-8')
          html = html.replace('.webp?v=1', '.jpg?v=2')
          html = html.replace('.webp', '.jpg')
          page.write_text(html, encoding='utf-8')

          for src in gallery.glob('*.webp'):
              src.unlink()
          PY

      - name: Remover automação temporária
        run: rm -f .github/workflows/converter-webp-para-jpg.yml

      - name: Guardar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Converter galeria para JPG e remover WebP"
          git push origin main

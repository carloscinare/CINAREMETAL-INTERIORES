<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Galeria de mobiliário industrial CINARÉ em aço e madeira.">
  <title>Mobiliário Industrial — CINARÉ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#090c0f;--panel:#11161b;--line:#242c33;--text:#f3f5f7;--muted:#a9b3bb;--accent:#d5a246;--max:1180px}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.55}
    a{color:inherit;text-decoration:none}
    .wrap{width:min(var(--max),calc(100% - 36px));margin:auto}
    header{position:sticky;top:0;z-index:20;background:rgba(9,12,15,.88);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.06)}
    nav{height:74px;display:flex;align-items:center;justify-content:space-between;gap:20px}
    .brand{font-size:20px;font-weight:800;letter-spacing:.16em}.brand span{color:var(--accent)}
    .back{padding:10px 14px;border:1px solid #303841;border-radius:10px;background:#10151a;font-size:14px;font-weight:700}
    .hero{padding:86px 0 54px;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
    .hero:before{content:"";position:absolute;right:-150px;top:-170px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(213,162,70,.13),transparent 72%)}
    .eyebrow{color:var(--accent);font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:12px}
    h1{font-size:clamp(42px,6vw,72px);line-height:1.02;letter-spacing:-.045em;margin:12px 0 18px}
    .lead{color:var(--muted);font-size:18px;max-width:720px;margin:0}
    main{padding:64px 0 90px}
    .gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    .item{position:relative;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--panel);cursor:pointer;padding:0;text-align:left;color:inherit;font:inherit;transition:.2s}
    .item:hover{transform:translateY(-3px);border-color:#46515b}
    .item .thumb{height:280px;background:#f2efeb;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .item img{display:block;width:100%;height:100%;object-fit:contain}
    .caption{display:block;padding:16px 18px 18px}
    .caption b{display:block;font-size:17px;margin-bottom:3px}.caption small{color:var(--muted)}
    .lightbox{position:fixed;inset:0;z-index:100;background:rgba(4,6,8,.94);display:none;align-items:center;justify-content:center;padding:30px}
    .lightbox.open{display:flex}
    .lightbox-inner{width:min(1180px,100%);display:grid;grid-template-columns:56px 1fr 56px;align-items:center;gap:14px}
    .viewer{text-align:center}
    .viewer img{max-width:100%;max-height:78vh;border-radius:16px;box-shadow:0 30px 90px rgba(0,0,0,.6);background:#f2efeb}
    .viewer h2{margin:16px 0 2px;font-size:22px}.viewer p{margin:0;color:var(--muted)}
    .navbtn,.close{border:1px solid #34404a;background:#111820;color:#fff;border-radius:12px;font-size:28px;cursor:pointer;height:56px}
    .navbtn:hover,.close:hover{border-color:#687681}
    .close{position:absolute;top:22px;right:22px;width:48px;height:48px;font-size:22px}
    footer{border-top:1px solid var(--line);padding:28px 0 44px;color:#8e989f;font-size:13px}
    .foot{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
    @media(max-width:900px){.gallery{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:560px){.gallery{grid-template-columns:1fr}.hero{padding-top:60px}.brand{font-size:16px}.item .thumb{height:260px}.lightbox{padding:18px}.lightbox-inner{grid-template-columns:1fr}.navbtn{position:absolute;bottom:22px;width:52px}.prev{left:22px}.next{right:22px}.viewer img{max-height:68vh}}
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <nav>
      <a class="brand" href="./index.html">CINARÉ <span>METAL</span></a>
      <a class="back" href="./index.html#servicos">← Voltar ao site</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <div class="eyebrow">Mobiliário industrial</div>
    <h1>Ideias em aço e madeira.</h1>
    <p class="lead">Seleciona qualquer imagem para a abrir em grande e veres o render com mais detalhe. Usa as setas para navegar entre os projetos.</p>
  </div>
</section>

<main>
  <div class="wrap">
    <div class="gallery">
      <button class="item" data-src="./galeria/consola-industrial-nova.jpg?v=3" data-title="Consola industrial" data-sub="Consola baixa com prateleira inferior e travamento cruzado">
        <span class="thumb"><img src="./galeria/consola-industrial-nova.jpg?v=3" alt="Consola industrial"></span>
        <span class="caption"><b>Consola industrial</b><small>Aço + madeira</small></span>
      </button>

      <button class="item" data-src="./galeria/estante-industrial.jpg?v=3" data-title="Estante industrial" data-sub="Estante de três níveis para sala, entrada ou escritório">
        <span class="thumb"><img src="./galeria/estante-industrial.jpg?v=3" alt="Estante industrial"></span>
        <span class="caption"><b>Estante industrial</b><small>Aço + madeira</small></span>
      </button>

      <button class="item" data-src="./galeria/mesa-apoio-nova.jpg?v=3" data-title="Mesa de apoio" data-sub="Mesa lateral compacta com prateleira inferior">
        <span class="thumb"><img src="./galeria/mesa-apoio-nova.jpg?v=3" alt="Mesa de apoio"></span>
        <span class="caption"><b>Mesa de apoio</b><small>Aço + madeira</small></span>
      </button>

      <button class="item" data-src="./galeria/suporte-planta.jpg?v=3" data-title="Suporte para planta" data-sub="Estrutura geométrica em aço com caixa em madeira">
        <span class="thumb"><img src="./galeria/suporte-planta.jpg?v=3" alt="Suporte para planta"></span>
        <span class="caption"><b>Suporte para planta</b><small>Interior / decoração</small></span>
      </button>

      <button class="item" data-src="./galeria/prateleira-parede-nova.jpg?v=3" data-title="Prateleira de parede" data-sub="Prateleira suspensa com suportes metálicos">
        <span class="thumb"><img src="./galeria/prateleira-parede-nova.jpg?v=3" alt="Prateleira de parede"></span>
        <span class="caption"><b>Prateleira de parede</b><small>Aço + madeira</small></span>
      </button>

      <button class="item" data-src="./galeria/porta-revistas.jpg?v=3" data-title="Porta-revistas" data-sub="Suporte industrial para revistas e livros">
        <span class="thumb"><img src="./galeria/porta-revistas.jpg?v=3" alt="Porta-revistas"></span>
        <span class="caption"><b>Porta-revistas</b><small>Aço + couro</small></span>
      </button>

      <button class="item" data-src="./galeria/banco-sapateira-novo.jpg?v=3" data-title="Banco sapateira" data-sub="Banco com tampo em madeira e prateleira metálica para calçado">
        <span class="thumb"><img src="./galeria/banco-sapateira-novo.jpg?v=3" alt="Banco sapateira"></span>
        <span class="caption"><b>Banco sapateira</b><small>Entrada / corredor</small></span>
      </button>

      <button class="item" data-src="./galeria/banco-alto-novo.jpg?v=3" data-title="Banco alto" data-sub="Banco alto para cozinha, bancada ou espaço comercial">
        <span class="thumb"><img src="./galeria/banco-alto-novo.jpg?v=3" alt="Banco alto"></span>
        <span class="caption"><b>Banco alto</b><small>Aço + madeira</small></span>
      </button>
    </div>
  </div>
</main>

<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="close" id="close" aria-label="Fechar">×</button>
  <div class="lightbox-inner">
    <button class="navbtn prev" id="prev" aria-label="Imagem anterior">‹</button>
    <div class="viewer">
      <img id="largeImg" alt="">
      <h2 id="largeTitle"></h2>
      <p id="largeSub"></p>
    </div>
    <button class="navbtn next" id="next" aria-label="Imagem seguinte">›</button>
  </div>
</div>

<footer>
  <div class="wrap foot"><div>© 2026 CINARÉ Metal & Interiores</div><div>Barcelos · Portugal</div></div>
</footer>

<script>
  const items=[...document.querySelectorAll('.item')];
  const box=document.getElementById('lightbox');
  const img=document.getElementById('largeImg');
  const title=document.getElementById('largeTitle');
  const sub=document.getElementById('largeSub');
  let current=0;

  function show(i){
    current=(i+items.length)%items.length;
    const e=items[current];
    img.src=e.dataset.src;
    img.alt=e.dataset.title;
    title.textContent=e.dataset.title;
    sub.textContent=e.dataset.sub;
    box.classList.add('open');
    box.setAttribute('aria-hidden','false');
    document.body.style.overflow='hidden';
  }

  function closeBox(){
    box.classList.remove('open');
    box.setAttribute('aria-hidden','true');
    document.body.style.overflow='';
  }

  items.forEach((e,i)=>e.onclick=()=>show(i));
  document.getElementById('prev').onclick=()=>show(current-1);
  document.getElementById('next').onclick=()=>show(current+1);
  document.getElementById('close').onclick=closeBox;
  box.onclick=e=>{if(e.target===box)closeBox()};
  document.onkeydown=e=>{
    if(!box.classList.contains('open'))return;
    if(e.key==='Escape')closeBox();
    if(e.key==='ArrowLeft')show(current-1);
    if(e.key==='ArrowRight')show(current+1);
  };
</script>
</body>
</html>
